<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>www.kunoluarts.com</title>
  <link rel="stylesheet" href="firstpage.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    body {
      padding: 10px;
      text-align: none;
      transition: background 0.5s ease, color 0.5s ease;
    }

    h1 {
      margin-bottom: 30px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    button {
      cursor: pointer;
    }

    /* Stylish dark mode toggle */
    .dark-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 16px;
      font-size: 14px;
      color: #fff;
      background-color: #111;
      border: 2px solid #00ffff;
      border-radius: 50px;
      box-shadow: 0 0 10px #00ffff;
      transition: all 0.4s ease;
      z-index: 999;
    }

    .dark-toggle:hover {
      background-color: #00ffff;
      color: #000;
      box-shadow: 0 0 20px #00ffff;
    }
  </style>

  <script>
    function toggleDarkMode() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute("data-theme");
      html.setAttribute("data-theme", currentTheme === "dark" ? "light" : "dark");
    }
  </script>
</head>

<body>
  <button class="dark-toggle" onclick="toggleDarkMode()">🌓 Theme</button>

  <div class="container">
    <a href="first page.html"><button class="btn-neon">Home</button></a>
    <a href="aboutus.html"><button class="btn-gradient">About Us</button></a>
    <a href="contact.html"><button class="btn-cyberpunk">Contact Info</button></a>
    <a href="credits.html"><button class="btn-sunset">Credits</button></a>
    <a href="history.html"><button class="btn-violet">History</button></a>
  </div>
    <form method="post" action="HOME.html">
        <textarea name="post" size="19"></textarea>
        <button type="submit">post</button>
    </form>
    <ul class="menu">
        <div class="toggleBtn">
            <ion-icon name="add-outline"></ion-icon>
        </div>
        <li style="--i:0; --x:-150px; --y:0px; --clr: rgb(183, 255, 0);">
            <a href="#">
                <ion-icon name="person-outline"></ion-icon>
            </a>
        </li>
        <li style="--i:1; --x:150px; --y:0px; --clr: rgb(255, 174, 0); ">
            <a href="#">
                <ion-icon name="code-slash-outline"></ion-icon>
            </a>
        </li>
        <li style="--i:2; --x:0px; --y:-150px;  --clr: rgb(43, 255, 0);  ">
            <a href="#">
                <ion-icon name="flower-outline"></ion-icon>
            </a>
        </li>
        <li style="--i:3; --x:105px; --y:105px; --clr: rgb(255, 0, 43); ">
            <a href="#">
                <ion-icon name="image-outline"></ion-icon>
            </a>
        </li>
        <li style="--i:4; --x:-105px; --y:-105px; --clr: rgb(0, 255, 187);">
            <a href="#">
                <ion-icon name="navigate-outline"></ion-icon>
            </a>
        </li>
        <li style="--i:5; --x:0px; --y:150px; --clr: rgb(0, 153, 255);">
            <a href="#">
                <ion-icon name="mail-unread-outline"></ion-icon>
            </a>
        </li>
        <li style="--i:6; --x:105px; --y:-105px; --clr: rgb(185, 100, 255);">
            <a href="#">
                <ion-icon name="laptop-outline"></ion-icon>
            </a>
        </li>
        <li style="--i:7; --x:-105px; --y:105px; --clr: rgb(255, 0, 200);">
            <a href="#">
                <ion-icon name="notifications-outline"></ion-icon>
            </a>
        </li>
    </ul>
    <script>
        let toggleBtn = document.querySelector('.toggleBtn');
        let menu = document.querySelector('.menu');
        toggleBtn.addEventListener('click', () => {
            menu.classList.toggle('active');
        });
    </script>
</body>
<div class="logo">
    <footer>
        &copy;kunoluarts 2024
    </footer>
</div>

</html>
