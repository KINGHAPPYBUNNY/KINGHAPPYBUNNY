<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/2c1a998ce.js" crossorigin="anonymous"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"> 

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      margin: 0;
      transition: background 0.5s ease, color 0.5s ease;
    }

    h1 {
      margin-bottom: 30px;
    }

    /* 🔹 Button container (responsive layout) */
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .container a button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 140px;
    }

    /* 🔹 Neon Style */
    .btn-neon {
      background: black;
      color: #0ff;
      border: 2px solid #0ff;
      box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    }
    .btn-neon:hover {
      background: #0ff;
      color: black;
    }

    /* 🔹 Gradient Style */
    .btn-gradient {
      background: linear-gradient(45deg, #ff0080, #7928ca);
      color: white;
    }
    .btn-gradient:hover {
      opacity: 0.85;
    }

    /* 🔹 Cyberpunk Style */
    .btn-cyberpunk {
      background: #111;
      color: #f5f5f5;
      border: 2px solid #ff00ff;
      text-transform: uppercase;
    }
    .btn-cyberpunk:hover {
      background: #ff00ff;
      color: black;
    }

    /* 🔹 Sunset Style */
    .btn-sunset {
      background: linear-gradient(90deg, #ff7e5f, #feb47b);
      color: white;
    }
    .btn-sunset:hover {
      opacity: 0.9;
    }

    /* 🔹 Violet Style */
    .btn-violet {
      background: linear-gradient(135deg, #8e2de2, #4a00e0);
      color: white;
    }
    .btn-violet:hover {
      opacity: 0.9;
    }

    /* 🔹 Mobile Responsive */
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .container a button {
        width: 90%;
        font-size: 18px;
      }
    }

    /* 🔹 Social Media Icons */
    .social {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 28px;
    }

    .social a {
      text-decoration: none;
    }

    .fa-facebook { color: #1877f2; }
    .fa-twitter { color: #1da1f2; }
    .fa-linkedin { color: #0077b5; }
    .fa-instagram { color: #e4405f; }
    .fa-whatsapp { color: #25d366; }
    .fa-envelope { color: #d44638; }

    /* 🔹 Dark Mode Toggle */
    .dark-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 16px;
      font-size: 14px;
      color: #fff;
      background-color: #111;
      border: 2px solid #00ffff;
      border-radius: 50px;
      box-shadow: 0 0 10px #00ffff;
      transition: all 0.4s ease;
      z-index: 999;
    }

    .dark-toggle:hover {
      background-color: #00ffff;
      color: #000;
      box-shadow: 0 0 20px #00ffff;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: gray;
    }
  </style>

  <script>
    function toggleDarkMode() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute("data-theme");
      html.setAttribute("data-theme", currentTheme === "dark" ? "light" : "dark");
    }
  </script>
</head>

<body>
